[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "shuffling"
version = "1.0.0"
description = "Exact mixing times of card-shuffling Markov chains (top-to-random, riffle) on S_N"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Selima Klibi"}]
dependencies = ["numpy>=1.24", "matplotlib>=3.7"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools]
packages = ["shuffling"]

[tool.pytest.ini_options]
testpaths = ["tests"]
